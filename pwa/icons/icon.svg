<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Map radar rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#DDD6FE" stroke-width="6" stroke-dasharray="12 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#F59E0B" stroke-width="8" opacity="0.5"/>
  <circle cx="256" cy="256" r="60" fill="#DDD6FE" opacity="0.15"/>
  
  <!-- Central Lion & Crown Emblem -->
  <text x="256" y="240" font-size="130" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">🦁</text>
  <text x="350" y="160" font-size="70" text-anchor="middle" dominant-baseline="middle">👑</text>

  <!-- Title Badge -->
  <rect x="76" y="360" width="360" height="74" rx="37" fill="#0B0C10" opacity="0.85" stroke="#F59E0B" stroke-width="3"/>
  <text x="256" y="406" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GYMKANA LEÓN</text>
</svg>
